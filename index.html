<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Training Lab</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .container {
      width: 90%;
      max-width: 800px;
      padding: 50px;
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      margin-bottom: 20px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 14px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    .workflow {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .card {
      padding: 18px 22px;
      min-width: 120px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      opacity: 0.85;
    }

    .footer {
      font-size: 14px;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="badge">DevOps Training Project</div>

    <h1>DevOps Training Lab</h1>

    <p class="subtitle">
      A beginner hands-on project demonstrating
      containerization, orchestration, and GitOps.
    </p>

    <div class="workflow">

      <div class="card">
        <h3>Docker</h3>
        <p>Containerization</p>
      </div>

      <div class="card">
        <h3>Kubernetes</h3>
        <p>Orchestration</p>
      </div>

      <div class="card">
        <h3>Argo CD</h3>
        <p>GitOps</p>
      </div>

    </div>

    <p class="footer">
      Built for DevOps hands-on practice
    </p>

  </div>

</body>
</html>
