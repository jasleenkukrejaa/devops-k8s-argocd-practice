apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web
  namespace: devops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-web

  template:
    metadata:
      labels:
        app: devops-web

    spec:
      containers:
      - name: web
        image: devops-web:1.1
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 80

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
